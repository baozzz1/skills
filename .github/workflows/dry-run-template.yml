name: Dry-run template build on PR

# Build-only validation for skills/interactive-showcase-site/template/ during
# pull-request review (合码阶段). No Pages deploy — the real publish lives in
# .github/workflows/deploy-template.yml and runs after merge to main/develop.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'skills/interactive-showcase-site/template/**'
      - '.github/workflows/dry-run-template.yml'
      - '.github/workflows/deploy-template.yml'

permissions:
  contents: read

concurrency:
  group: dry-run-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/interactive-showcase-site/template
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          # Mirror the real deploy env so the dry-run catches base-path /
          # asset-URL regressions before merge.
          BASE_PATH: /skills/
          SITE_URL: https://baozzz1.github.io
